<style>
:root{
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#10152A; --surface:#1A2140; --ink:#E6E9F4; --muted:#98A0BE; --line:#2E3761;
  --gold:#E0B84A; --gold-soft:#3A3417; --win:#4CC486; --loss:#F06078;
  --amber:#F4B223; --amethyst:#B069B8; --emerald:#3FB24C; --ruby:#F0335A; --sapphire:#3BAEE0; --steel:#A7B0BF;
  --radius-s:6px; --radius-m:12px;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;color:inherit;font:inherit}
button.ghost{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:15px;color:var(--ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.app{max-width:720px;margin:0 auto;padding:0 16px 160px}
.import .drop{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;justify-content:center;text-align:center;padding:10px 14px;border:2px dashed var(--line);border-radius:var(--radius-m);background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.import .drop.drag{border-color:var(--gold);background:var(--gold-soft)}
.import .drop-main{font:600 15px var(--body)}
.import .drop-sub{font-size:12px;color:var(--muted)}
.linkrow{display:flex;gap:8px;margin-top:8px}
.linkrow .field{flex:1 1 auto;min-width:0;padding:8px 12px}
.linkrow .chip{flex:0 0 auto}
.import-status .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.goal{display:flex;align-items:center;gap:10px;margin:0 0 18px;font-size:14px}
.goal .gbar{flex:1 1 auto;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.goal .gbar .fill{display:block;height:100%;background:var(--gold);border-radius:999px}
.goal .gbar .fill.done{background:var(--win)}
.goal .txt{white-space:nowrap;color:var(--muted)}
.goal .txt b{color:var(--ink)}
.goal-set{display:flex;align-items:center;gap:8px;margin:0 0 18px;font-size:14px;flex-wrap:wrap}
.goal-set .field{width:84px;padding:8px 10px}
.import-status{margin-top:10px;font-size:14px;border-radius:var(--radius-s);padding:10px 12px;background:var(--surface);border:1px solid var(--line)}
.import-status.ok{border-color:var(--win);color:var(--win)}
.import-status.err{border-color:var(--loss);color:var(--loss)}
.import-status ul{margin:6px 0 0;padding-left:18px}
.backup-nag{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 18px;padding:10px 12px;border:1px solid var(--gold);background:var(--gold-soft);border-radius:var(--radius-s);font-size:14px}
.backup-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 0 10px}
header.top h1{font:700 30px/1 var(--display);margin:0;letter-spacing:.01em;white-space:nowrap}
header.top .who{font-size:14px;color:var(--muted);display:flex;align-items:baseline;gap:6px;min-width:0}
header.top .who input{border:0;border-bottom:1.5px dashed var(--line);background:none;width:8em;max-width:40vw;padding:2px 0;color:var(--ink);font-weight:600}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
nav.tabs button{flex:1 1 0;min-width:0;border:0;background:none;padding:10px 2px;font:600 16px/1 var(--display);color:var(--muted);border-radius:var(--radius-s)}
nav.tabs button[aria-selected="true"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 -3px 0 var(--gold)}

section.block{margin:0 0 22px}
.block h2{font:600 20px/1.1 var(--display);margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:space-between;align-items:baseline}
.block h2 small{font:400 13px var(--body);color:var(--muted)}

/* Ink gems: the core input */
.gems{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.gem{border:0;background:none;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.gem .hex{width:46px;height:52px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--c);opacity:.35;transition:opacity .12s,transform .12s;display:grid;place-items:center;color:#fff;font-weight:700}
.gem[aria-pressed="true"] .hex{opacity:1;transform:scale(1.06)}
.gem[aria-pressed="true"]{color:var(--ink);font-weight:600}
.gem[aria-pressed="true"] .hex::after{content:"✓";font-size:20px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.gems.small .hex{width:30px;height:34px}

.mini{display:inline-flex;gap:2px;vertical-align:middle}
.mini i{display:inline-block;width:13px;height:15px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--c)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);font-weight:600}
.chip.add{border-style:dashed;color:var(--muted)}

.result{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result.bo3{grid-template-columns:repeat(4,1fr)}
.res{border:2px solid var(--line);background:var(--surface);border-radius:var(--radius-m);padding:16px 6px;font:700 24px/1 var(--display)}
.res.w[aria-pressed="true"]{background:var(--win);border-color:var(--win);color:#fff}
.res.l[aria-pressed="true"]{background:var(--loss);border-color:var(--loss);color:#fff}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.field{display:block;width:100%;border:1.5px solid var(--line);border-radius:var(--radius-s);background:var(--surface);padding:10px 12px}
details.seen{margin-top:8px;font-size:14px}
details.seen summary{cursor:pointer;color:var(--muted);list-style:none}
details.seen summary::-webkit-details-marker{display:none}
details.seen summary::after{content:" ▾"}
details.seen[open] summary::after{content:" ▴"}
.seenlist{list-style:none;margin:6px 0 0;padding:0;columns:2 150px;column-gap:16px}
.seenlist li{break-inside:avoid;padding:2px 0}
.seenlist .n{display:inline-block;min-width:2.2em;font-variant-numeric:tabular-nums;color:var(--gold);font-weight:600}
.deckhint{margin:8px 0 0;font-size:14px;padding:8px 12px;border-radius:var(--radius-s);border:1px solid var(--gold);background:var(--gold-soft)}
.deckhint.ok{border-color:var(--line);background:transparent;color:var(--muted)}
.import-status .namerow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.import-status .namerow .field{flex:1 1 160px;padding:8px 10px}
section.more h2 .opt{font:400 14px var(--body);color:var(--muted);margin-left:6px}
details.sec{border:1.5px solid var(--line);border-radius:var(--radius-m);background:var(--surface);margin-top:10px}
details.sec>summary{display:flex;align-items:baseline;gap:10px;padding:12px 14px;cursor:pointer;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .st{font:600 16px var(--body);flex:0 0 auto}
details.sec>summary .sv{flex:1 1 auto;min-width:0;text-align:right;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.sec>summary::after{content:"+";flex:0 0 auto;font:600 18px var(--body);color:var(--muted);width:14px;text-align:center}
details.sec[open]>summary::after{content:"−"}
details.sec[open]>summary .sv{visibility:hidden}
details.sec .inner{display:grid;gap:14px;padding:2px 14px 14px}
section.more{border-top:0}
.editbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 16px;padding:12px 14px;border:1.5px solid var(--gold);border-radius:var(--radius-m);background:var(--gold-soft);font-size:14px;top:env(safe-area-inset-top,0px)}
.editbar .et{flex:1 1 200px;min-width:0}
.editbar .et b{display:block;font-size:15px}
.editbar .acts{display:flex;gap:8px;flex-wrap:wrap}
body.editing #tab-entry .import,body.editing #goalBox,body.editing #backupNag{display:none !important}
details.more{border-top:1px solid var(--line);padding-top:12px}
details.more summary{cursor:pointer;font:600 18px var(--display);color:var(--muted);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}
details.more[open] summary::before{content:"− "}
details.more .inner{display:grid;gap:14px;padding-top:12px}

.sub-h{font:600 15px var(--body);color:var(--muted);margin:0 0 6px}
.grp{display:grid;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.three .sub-h{font-size:13px}
.num-in button{flex:0 0 34px}
.num-in{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:var(--radius-s);background:var(--surface);overflow:hidden}
.num-in button{border:0;background:none;width:34px;height:40px;font-size:20px;color:var(--muted)}
.num-in input{border:0;background:none;width:100%;text-align:center;font:600 18px var(--display);padding:0;-moz-appearance:textfield}
.num-in input::-webkit-outer-spin-button,.num-in input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chip .x{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--loss);color:#fff;font-size:12px;line-height:1;margin-left:2px}
.chip.editing{padding:4px 6px;gap:2px;border-style:dashed}
.chip.editing .mv{border:0;background:none;width:30px;height:32px;border-radius:6px;font-size:14px;color:var(--ink)}
.chip.editing .mv:disabled{opacity:.25;cursor:default}
.chip.editing .mv:not(:disabled):hover{background:var(--gold-soft)}
.chip.editing > span{padding:0 4px;white-space:nowrap}
.chip.editing.hiddenTag{opacity:1;text-decoration:none}
.chip.editing.hiddenTag > span{opacity:.45;text-decoration:line-through}
.chip.editing.hiddenTag .x{background:var(--win)}
.chip.editing .x{border:0;padding:0;flex:0 0 24px;width:24px;height:24px;cursor:pointer;margin-left:4px;font-size:13px}
.chip.hiddenTag{opacity:.4;text-decoration:line-through}
.chip.linkish{border:0;background:none;color:var(--muted);text-decoration:underline;padding:8px 4px}
.addtag{display:flex;gap:8px}
.addtag input{flex:1}
.replays{display:grid;gap:8px}
ul.log .links{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:10px;font-size:14px}
ul.log .links a{color:var(--ink);font-weight:600}
ul.log .edit{grid-column:1 / 4;display:grid;gap:8px;padding:10px;border:1.5px dashed var(--line);border-radius:var(--radius-m);margin-top:6px}
.newdeck{border:1.5px dashed var(--line);border-radius:var(--radius-m);padding:12px;margin-top:10px;display:grid;gap:10px}

.savebar{pointer-events:none;position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.savebar button{pointer-events:auto;display:block;width:100%;max-width:688px;margin:0 auto;border:0;border-radius:var(--radius-m);padding:16px;background:var(--ink);color:var(--bg);font:700 22px/1 var(--display);letter-spacing:.02em}
.savebar button:disabled{opacity:.35;cursor:not-allowed}
.savebar .hint{max-width:688px;margin:0 auto 6px;font-size:13px;color:var(--muted);text-align:center;min-height:1em}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;display:none;gap:14px;align-items:center;z-index:9;font-size:15px}
.toast.show{display:flex}
.toast button{background:none;border:0;color:var(--gold);font-weight:600;padding:0}

/* Auswertung */
details.filterbox{margin-bottom:18px}
details.filterbox summary{cursor:pointer;font:600 18px var(--display);list-style:none;padding:4px 0 10px}
details.filterbox summary::-webkit-details-marker{display:none}
details.filterbox summary::after{content:" ▾";color:var(--muted)}
.filters input[data-fo]{display:block;width:100%;border:1.5px solid var(--line);border-radius:var(--radius-s);background:var(--surface);padding:8px 10px}
details.filterbox[open] summary::after{content:" ▴"}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:18px}
.filters label{font-size:12px;color:var(--muted);display:grid;gap:3px}
.filters select{border:1.5px solid var(--line);border-radius:var(--radius-s);background:var(--surface);padding:8px}
.headline{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.headline .big{font:700 64px/0.9 var(--display)}
.headline .big span{font-size:28px}
.headline dl{display:grid;grid-template-columns:auto auto;gap:2px 12px;margin:0;font-size:14px}
.headline dt{color:var(--muted)} .headline dd{margin:0;font-weight:600}
table.stats{width:100%;border-collapse:collapse;font-size:15px}
table.stats td:first-child{white-space:nowrap}
table.stats th{white-space:nowrap;font:600 13px var(--body);color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
table.stats td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.stats td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.thin td{opacity:.55}
.bar{height:8px;border-radius:4px;background:var(--line);position:relative;min-width:60px}
.bar b{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--gold)}
.bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.5}
.scroll{overflow-x:auto}
table.matrix{border-collapse:separate;border-spacing:3px;font-size:13px}
table.matrix th{font-weight:500;color:var(--muted);padding:4px;text-align:center;white-space:nowrap}
table.matrix th.rowh{text-align:left}
table.matrix td{min-width:52px;text-align:center;padding:6px 4px;border-radius:var(--radius-s);font-variant-numeric:tabular-nums;line-height:1.1}
table.matrix td small{display:block;opacity:.75;font-size:11px}
.note{font-size:13px;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--radius-m)}

/* Verlauf */
ul.log{list-style:none;margin:0;padding:0}
ul.log li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.badge{font:700 18px/1 var(--display);width:42px;text-align:center;padding:8px 0;border-radius:var(--radius-s);color:#fff}
.badge.W{background:var(--win)} .badge.L{background:var(--loss)}
ul.log .main{font-size:15px}
ul.log li li{display:block;padding:2px 0;border:0;font-size:13px}
ul.log details.seen{font-size:13px;margin-top:4px}
.opening{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.oside{border:1px solid var(--line);border-radius:var(--radius-s);padding:6px 8px}.oside .oh{font-weight:600;font-size:12px;color:var(--muted);margin-bottom:4px}.otrow{display:flex;gap:6px;padding:2px 0}.otrow .ot{flex:0 0 auto;font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}.otrow .ol{flex:1 1 auto;min-width:0}.og{font-weight:600;font-size:13px;margin:8px 0 2px}@media (max-width:420px){.opening{grid-template-columns:1fr}}
ul.log .sub{font-size:13px;color:var(--muted);grid-column:2}
ul.log li.pack{border-left:3px solid var(--gold);background:color-mix(in srgb, var(--gold) 7%, transparent);padding-left:10px;padding-right:6px;border-radius:var(--radius-s);margin:6px 0;border-bottom:0}
ul.log .games{display:block;margin:6px 0 4px}
ul.log .grow{display:flex;align-items:center;gap:8px;padding:2px 0;color:var(--ink)}
ul.log .gb{flex:0 0 22px;height:22px;display:inline-grid;place-items:center;border-radius:6px;font-weight:700;font-size:12px;color:#10152A}
ul.log .gb.W{background:var(--win)} ul.log .gb.L{background:var(--loss)} ul.log .gb.Q{background:var(--line);color:var(--ink)}
ul.log .grow.miss{color:var(--muted)} ul.log .grow.miss .gb{opacity:.55;outline:1.5px dashed var(--muted);outline-offset:1px}
.viewopt{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 2px 4px;font-size:14px;color:var(--ink)}
.viewopt input{width:18px;height:18px;accent-color:var(--gold)}
nav.tabs button[hidden]{display:none}
.logtools{flex-wrap:wrap;gap:8px;margin-bottom:10px}
.archmgr{border:1.5px solid var(--line);border-radius:var(--radius-m);padding:10px 12px;margin-bottom:12px}
.archmgr .amgroup{margin-top:10px}
.archmgr .amrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:4px 0}
.archmgr .amrow input{flex:1 1 9em;min-width:0}
.selbox{width:18px;height:18px;vertical-align:-3px;accent-color:var(--gold)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1.5px solid var(--gold);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:grid;gap:8px;box-shadow:0 -6px 18px rgba(0,0,0,.35)}
.selbar .selhead,.selbar .selact{display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:688px;width:100%;margin:0 auto}
.selbar .selact .field{flex:1 1 10em;min-width:0}
#tab-log{padding-bottom:140px}
.repair{border:1.5px solid var(--gold);border-radius:var(--radius-m);padding:10px 12px;margin:0 0 12px;font-size:14px;line-height:1.45}
.repair .chip{margin-top:8px}
ul.log .del{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline}
.banner{background:var(--gold-soft);border-radius:var(--radius-s);padding:10px 12px;font-size:14px;margin-bottom:14px}
.banner.warn{background:color-mix(in srgb, var(--loss) 22%, var(--surface));border:1.5px solid var(--loss);line-height:1.45}
.banner.warn .acts{margin-top:8px}
/* Bo3 Einzelspiele */
.games{display:grid;gap:10px;margin-top:12px}
.game{border:1.5px solid var(--line);border-radius:var(--radius-m);background:var(--surface);padding:10px 12px;display:grid;gap:8px}
.game.done{border-color:var(--muted)}
.game-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font:600 18px/1 var(--display)}
.game .result .res{padding:10px 4px;font-size:20px}
.chips.tight{gap:5px}
.chips.tight .chip{padding:5px 11px;font-size:14px}
.series{font:700 22px/1 var(--display);margin-top:4px}
/* Lore-Zähler */
.lore{display:grid;grid-template-rows:1fr auto 1fr;gap:8px;height:calc(100dvh - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:420px}
.side{display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:stretch;border:2px solid var(--line);border-radius:var(--radius-m);background:var(--surface);position:relative;overflow:hidden}
.side.opp{transform:rotate(180deg)}
.side.active{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.side button{border:0;background:none;font:600 44px/1 var(--display);color:var(--muted);touch-action:manipulation}
.side button:active{background:var(--gold-soft)}
.side .val{display:grid;place-items:center;font:700 clamp(72px,22vw,128px)/1 var(--display);font-variant-numeric:tabular-nums}
.side .who{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:13px;color:var(--muted);pointer-events:none}
.side.win .val{color:var(--win)}
.lore-mid{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;text-align:center}
.lore-mid .turn{font:600 20px/1 var(--display)}
.lore-mid .msg{flex-basis:100%;font-size:14px;color:var(--muted)}
.lore-mid .big-btn{border:0;border-radius:var(--radius-m);padding:12px 18px;background:var(--ink);color:var(--bg);font:700 18px/1 var(--display)}
/* Diagramme */
.trend svg{display:block}
.trend text{font:12px var(--body);fill:var(--muted)}
.cardvars{display:flex;flex-wrap:wrap;gap:6px}
.cardvars span{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:13px;white-space:nowrap}
.cardvars span.thin{opacity:.55}
.profile{padding:8px 0;border-bottom:1px solid var(--line)}
.profile p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.statnote{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.chip.small{font-size:13px;padding:5px 10px}
.chip .dq{color:var(--muted);font-size:12px;font-weight:400}
.chip[aria-pressed="false"] .dq{opacity:.7}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Match-Log</h1>
    <label class="who">Spieler: <input id="player" placeholder="dein Name" autocomplete="nickname" maxlength="30"></label>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="entry" aria-selected="true">Eintragen</button>
    <button role="tab" data-tab="counter" aria-selected="false">Zähler</button>
    <button role="tab" data-tab="stats" aria-selected="false">Auswerten</button>
    <button role="tab" data-tab="log" aria-selected="false">Verlauf</button>
  </nav>
  <div id="storeWarn" class="banner warn" role="alert" hidden></div>
  <div id="banner" class="banner" hidden></div>

  <!-- EINTRAGEN -->
  <main id="tab-entry">
    <div class="editbar" id="editBar" hidden></div>
    <section class="block import">
      <label class="drop" id="dropZone">
        <input type="file" id="replayFile" multiple hidden>
        <span class="drop-main">Replay-Datei einlesen</span>
        <span class="drop-sub">optional, füllt das Formular aus</span>
      </label>
      <div class="linkrow">
        <input class="field" id="replayLink" type="url" inputmode="url" placeholder="oder Replay-Link einfügen" autocomplete="off">
        <button class="chip" type="button" id="replayLinkGo">Laden</button>
      </div>
      <div class="import-status" id="importStatus" hidden></div>
    </section>

    <div id="goalBox"></div>

    <div class="backup-nag" id="backupNag" hidden><span id="backupNagMsg"></span><button class="chip" id="backupNagBtn" aria-pressed="true">Jetzt sichern</button></div>

    <section class="block">
      <h2>Mein Deck</h2>
      <div class="chips" id="deckChips"></div>
      <p class="deckhint" id="deckHint" hidden></p>
      <div class="newdeck" id="newDeck" hidden>
        <div class="gems small" id="newDeckGems"></div>
        <input class="field" id="newDeckName" placeholder="Deckname, z. B. Amber/Steel Mickey" maxlength="40">
        <div class="row"><button class="chip" id="newDeckSave" aria-pressed="true">Deck übernehmen</button><button class="chip" id="newDeckCancel">Abbrechen</button></div>
      </div>
    </section>

    <section class="block">
      <h2>Gegner</h2>
      <div class="gems" id="oppGems"></div>
      <div class="chips" id="archChips" style="margin-top:10px"></div>
      <div class="two arch-add" id="archAddRow" hidden>
        <input class="field" id="newArch" placeholder="Variante benennen, z. B. Aggro" maxlength="40">
        <button class="chip" id="saveArch" type="button">Sichern</button>
      </div>
      <p class="note" id="archHint" hidden></p>
      <div id="seenBox"></div>
      <div class="row" style="margin-top:8px"><button class="chip linkish" type="button" id="pinOpp"></button></div>
    </section>

    <section class="block">
      <h2>Ergebnis <span class="seg" id="fmtSeg"><button data-v="bo1">Bo1</button><button data-v="bo3">Bo3</button></span></h2>
      <div class="result" id="resultBox"></div>
      <div class="row" id="perGameRow" style="margin-top:10px" hidden><button class="chip" type="button" id="perGameToggle"></button></div>
      <div class="games" id="gameBoxes" hidden></div>
      <div class="addtag" id="gAddRow" style="margin-top:8px" hidden>
        <input class="field" id="gNewTag" placeholder="Name für deinen Knopf, z. B. Ramp auf 2" maxlength="30">
        <button class="chip" id="gNewTagSave" aria-pressed="true" type="button">Hinzufügen</button>
      </div>
    </section>

    <section class="block" id="startBlock">
      <h2 id="startLabel">Wer hat angefangen?</h2>
      <div class="seg" id="playSeg"><button data-v="play">Ich</button><button data-v="draw">Gegner</button></div>
    </section>

    <section class="block">
      <h2>Event</h2>
      <div class="chips" id="eventChips"></div>
      <div class="chips" id="tourneyActive" style="margin-top:8px" hidden></div>
    </section>

    <section class="more block" id="more">
      <h2>Weitere Angaben <span class="opt">optional</span></h2>
      <details class="sec" data-sec="play">
        <summary><span class="st">Spielverlauf</span><span class="sv" data-sv="play"></span></summary>
        <div class="inner">
        <div class="grp" id="tagGrp">
          <p class="sub-h">Markierungen</p>
          <div class="chips" id="tagChips"></div>
          <div class="addtag" id="addTagRow" hidden>
            <input class="field" id="newTag" placeholder="Name für deinen Knopf, z. B. Lilo gezogen" maxlength="30">
            <button class="chip" id="newTagSave" aria-pressed="true">Hinzufügen</button>
          </div>
          </div>
        <div class="grp" id="mullGrp">
          <p class="sub-h">Mulligan</p>
          <div class="chips" id="mullChips"></div>
        </div>
        <div class="grp" id="turnsGrp">
          <p class="sub-h">Züge (Spieldauer)</p>
          <input class="field" id="turns" type="number" inputmode="numeric" min="1" max="40" placeholder="z. B. 8" style="max-width:9em">
        </div>
        <div class="grp">
          <p class="sub-h">Eigene Leistung</p>
          <div class="chips" id="perfChips"></div>
        </div>
        </div>
      </details>
      <details class="sec" data-sec="opp">
        <summary><span class="st">Gegner &amp; Turnier</span><span class="sv" data-sv="opp"></span></summary>
        <div class="inner">
        <div class="grp">
          <p class="sub-h">Gegnername</p>
          <input class="field" id="oppName" list="nameList" placeholder="Gegnername" maxlength="40">
          <datalist id="nameList"></datalist>
        </div>
        <div class="grp" id="tourneyGrp">
          <p class="sub-h">Turnier</p>
          <div class="two">
            <input class="field" id="tourney" list="tourneyList" placeholder="Name, z. B. Set Champs Köln" maxlength="50">
            <input class="field" id="round" type="number" inputmode="numeric" min="1" max="20" placeholder="Runde">
          </div>
          <datalist id="tourneyList"></datalist>
        </div>
        </div>
      </details>
      <details class="sec" data-sec="notes">
        <summary><span class="st">Notizen</span><span class="sv" data-sv="notes"></span></summary>
        <div class="inner">
        <div class="grp">
                    <input class="field" id="keyCards" placeholder="Schlüsselkarten, z. B. Be Prepared, Hades" maxlength="120">
          <textarea class="field" id="notes" rows="2" placeholder="Was ist dir aufgefallen? Fehler, Ideen, Sideboard-Plan …" maxlength="500"></textarea>
        </div>
        </div>
      </details>
      <details class="sec" data-sec="rep">
        <summary><span class="st">Replay &amp; Format</span><span class="sv" data-sv="rep"></span></summary>
        <div class="inner">
        <div class="grp">
          <p class="sub-h">Replay</p>
          <div class="replays" id="replayInputs"></div>
        </div>
        <div class="grp">
          <p class="sub-h">Format</p>
          <input class="field" id="meta" maxlength="30" style="max-width:14em">
        </div>
        </div>
      </details>
      <label class="viewopt"><input type="checkbox" id="showCounter"> Zähler-Tab anzeigen <span class="note">(Lore-Zähler für Spiele mit echten Karten)</span></label>
    </section>
  </main>

  <!-- ZÄHLER -->
  <main id="tab-counter" hidden>
    <div class="lore" id="lore">
      <div class="side opp" id="sideOpp"><button type="button" data-side="opp" data-d="-1" aria-label="Gegner minus eins">−</button><div class="val" id="loreOpp" aria-live="polite">0</div><button type="button" data-side="opp" data-d="1" aria-label="Gegner plus eins">+</button><span class="who">Gegner</span></div>
      <div class="lore-mid" id="loreMid"></div>
      <div class="side me" id="sideMe"><button type="button" data-side="me" data-d="-1" aria-label="Ich minus eins">−</button><div class="val" id="loreMe" aria-live="polite">0</div><button type="button" data-side="me" data-d="1" aria-label="Ich plus eins">+</button><span class="who">Ich</span></div>
    </div>
  </main>

  <!-- AUSWERTEN -->
  <main id="tab-stats" hidden>
    <details class="filterbox"><summary data-sum>Filter</summary><div class="filters" id="filters"></div></details>
    <div id="statsOut"></div>
  </main>

  <!-- VERLAUF -->
  <main id="tab-log" hidden>
    <details class="filterbox"><summary data-sum>Filter</summary><div class="filters" id="filtersLog"></div></details>
    <div class="row logtools"><button class="chip" type="button" id="selBtn">Mehrere auswählen</button><button class="chip" type="button" id="archMgrBtn">Varianten verwalten</button><span style="flex:1"></span><button class="chip" id="csvBtn" hidden>CSV herunterladen</button></div>
    <div id="archMgr" class="archmgr" hidden></div>
    <div id="logOut"></div>
    <div id="selBar" class="selbar" hidden></div>
  </main>
</div>

<div class="savebar" id="savebar">
  <div class="hint" id="saveHint"></div>
  <button id="saveBtn" disabled>Match speichern</button>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Rückgängig</button></div>

<script>
(() => {
"use strict";
const INKS = [
  {k:"amber",n:"Bernstein",c:"var(--amber)"},
  {k:"amethyst",n:"Amethyst",c:"var(--amethyst)"},
  {k:"emerald",n:"Smaragd",c:"var(--emerald)"},
  {k:"ruby",n:"Rubin",c:"var(--ruby)"},
  {k:"sapphire",n:"Saphir",c:"var(--sapphire)"},
  {k:"steel",n:"Stahl",c:"var(--steel)"},
];
const INK = Object.fromEntries(INKS.map(i => [i.k, i]));
const EVENTS = ["Ladder / Quickplay","Turnier online","Turnier Paper","Testrunde"];
const TAGS = ["Tintenprobleme","Schlechte Starthand","Flood","Gegner hatte die Kurve","Eigener Fehler","Knapp","Zeitdruck","Sehr klar","Gute Starthand","Schlüsselkarte nicht gezogen","Gegner-Fehler","Neue Liste getestet"];
const MULL = ["0","1","2","3","4","5","6","7"].map(v => [v, v]);
const PERF = ["1","2","3","4","5"];
const BO3 = [["2-0","W"],["2-1","W"],["1-2","L"],["0-2","L"]];
const GAMES_PLAYED = { "2-0": 2, "2-1": 3, "1-2": 3, "0-2": 2 };
/* Meta-Zeiträume, fest für alle. Neues Set: eine Zeile anhängen, der vorige Zeitraum endet automatisch. */
const METAS = [
  { id: "s14", name: "Set 14", from: "2026-10-03" },
];
const periodStart = p => new Date(p.from + "T00:00:00").getTime();
function periodOf(ts){ let cur = "pre"; METAS.forEach(p => { if (ts >= periodStart(p)) cur = p.id; }); return cur; }
const CUR_PERIOD = METAS[METAS.length - 1].id;
const fmtDay = iso => new Date(iso + "T00:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });

/* ---------- lokale Vorlieben (pro Gerät) ---------- */
const LS = {
  get(k, d){ try { const v = localStorage.getItem("ml-"+k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){
    try { const t = JSON.stringify(v); localStorage.setItem("ml-"+k, t); if (localStorage.getItem("ml-"+k) !== t) throw 0; return true; }
    catch { storageFailed(); return false; }
  }
};
const prefs = {
  player: LS.get("player",""),
  decks: LS.get("decks", []),          // [{name, colors}]
  deckKey: LS.get("deckKey", null),
  format: LS.get("format","bo1"),
  event: LS.get("event", EVENTS[0]),
  meta: LS.get("meta","Core S14"),
  customTags: LS.get("customTags", []),
  hiddenTags: LS.get("hiddenTags", []),
  tagOrder: LS.get("tagOrder", []),
  archetypes: LS.get("archetypes", {}),  // { "Amber+Steel": ["Steel Aggro", ...] }
  pinOpp: LS.get("pinOpp", false),
  weight: LS.get("weight", "game"),       // game | scaled | match
  trendRes: LS.get("trendRes", "week"),   // day | week
  weekGoal: LS.get("weekGoal", 0),        // 0 = kein Ziel
};
const cardNames = LS.get("cardNames", {});
function rememberNames(map){ if (!map) return; Object.assign(cardNames, map); LS.set("cardNames", cardNames); }
const cardName = id => cardNames[id] || id;
let tagEdit = false, showHidden = false;

/* ---------- Formular-Zustand ---------- */
const blankGame = () => ({ r: null, s: null, mull: null, tags: [], turns: null, openMe: null, openOpp: null });
const form = { opp: [], result: null, games: null, start: null, tags: [], newDeckColors: [], mull: null, perf: null, arch: null, archAdd: false, openMe: null, openOpp: null, seriesId: null,
  perGame: false, gl: [blankGame(), blankGame(), blankGame()], gAdd: false, myList: null, oppSeen: [], oppSeenN: {}, archSuggest: null, deckPending: null, deckHint: null };

/* ---------- Speicher: geteilte Datenbank, sonst lokal ---------- */
let matches = [];
let myId = null;
const store = {
  mode: "local",
  db: null,
  async init(){
    this.loadLocal();
    renderAll();
  },
  loadLocal(){ matches = LS.get("matches", []); },
  async add(m){
    if (this.mode === "db") {
      try { const ref = await this.db.collection("matches").add(m); return ref.id; }
      catch (e) {
        if (e && e.code === "invalid_argument") showBanner("readonly");
        else if (e && e.code === "quota_exceeded") showBanner("full");
        else showBanner("error");
        return null;
      }
    }
    const id = "l" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    matches.push({ id, ...m }); LS.set("matches", matches); renderAll(); return id;
  },
  async update(id, patch){
    if (this.mode === "db") { try { await this.db.doc("matches/"+id).update(patch); return true; } catch { showBanner("error"); return false; } }
    matches = matches.map(m => m.id === id ? { ...m, ...patch } : m); LS.set("matches", matches); renderAll(); return true;
  },
  async remove(id){
    if (this.mode === "db") { try { await this.db.doc("matches/"+id).delete(); } catch { showBanner("error"); } return; }
    matches = matches.filter(m => m.id !== id); LS.set("matches", matches); renderAll();
  }
};
/* Persönliche Knöpfe und Decks: pro Person in der Datenbank, damit sie auf jedem Gerät da sind */
const PREF_KEYS = ["customTags","hiddenTags","decks","tagOrder","archetypes"];
const prefBody = () => ({ customTags: prefs.customTags, hiddenTags: prefs.hiddenTags, decks: prefs.decks, tagOrder: prefs.tagOrder, archetypes: prefs.archetypes });
function prefsDoc(){ return store.db && myId ? store.db.doc("data/users/" + myId + "/prefs") : null; }
async function syncPrefsFromDb(){
  const ref = prefsDoc(); if (!ref) return;
  try {
    const snap = await ref.get();
    const remote = snap.exists ? snap.data() : {};
    let changed = false;
    // Zusammenführen: nichts, was auf diesem Gerät neu ist, geht verloren
    for (const k of ["customTags","hiddenTags"]) {
      const merged = [...new Set([...(remote[k] || []), ...prefs[k]])];
      if (merged.length !== (remote[k] || []).length) changed = true;
      prefs[k] = merged; LS.set(k, merged);
    }
    // Reihenfolge: die gespeicherte gilt, lokal Neues wird hinten angehängt
    const ro = remote.tagOrder || [];
    const order = [...ro, ...prefs.tagOrder.filter(t => !ro.includes(t))];
    if (order.length !== ro.length) changed = true;
    prefs.tagOrder = order; LS.set("tagOrder", order);
    const dm = new Map();
    [...(remote.decks || []), ...prefs.decks].forEach(d => dm.set(deckKeyOf(d), d));
    if (dm.size !== (remote.decks || []).length) changed = true;
    prefs.decks = [...dm.values()]; LS.set("decks", prefs.decks);
    if (changed || !snap.exists) await ref.set(prefBody());
    renderEntry();
  } catch {}
}
let prefWrite = Promise.resolve();

/* ---------- Gegner-Archetyp-Varianten pro Farbkombination ---------- */
function archListFor(ok){
  if (!ok) return [];
  const saved = prefs.archetypes[ok] || [];
  // Varianten, die nur in alten Matches vorkommen, aber noch nicht gespeichert sind, mitnehmen
  const seen = matches.filter(m => m.oppColors && pairKey(m.oppColors) === ok && m.oppArch).map(m => m.oppArch);
  return [...new Set([...saved, ...seen])];
}
function renderArch(){
  const box = $("#archChips"); if (!box) return;
  const ok = form.opp.length > 0 ? pairKey(form.opp) : null;
  if (!ok){
    box.innerHTML = '<span class="note">Erst Gegnerfarben wählen</span>';
    $("#archAddRow").hidden = true; form.arch = null; return;
  }
  const list = archListFor(ok);
  if (form.arch && !list.includes(form.arch)) form.arch = null;
  const chips = list.map(a => `<button class="chip" type="button" data-arch="${esc(a)}" aria-pressed="${a === form.arch}">${esc(a)}</button>`).join("");
  box.innerHTML = chips + `<button class="chip linkish" type="button" data-arch-add="1">${form.archAdd ? "Abbrechen" : "+ Variante"}</button>`;
  $("#archAddRow").hidden = !form.archAdd;
  const sg = form.archSuggest, hint = $("#archHint");
  hint.hidden = !(sg && form.arch === sg.name);
  if (!hint.hidden) hint.textContent = `${sg.sure ? "Erkannt" : "Vermutlich"} an ${sg.shared} Karten, die du bei dieser Variante schon gesehen hast. Antippen zum Ändern.`;
}
/* Archetyp-Erkennung: gesehene Gegnerkarten mit früheren Matches derselben Farbkombi vergleichen */
function archProfiles(ok){
  const prof = {};
  matches.forEach(m => {
    if (!m.oppArch || !Array.isArray(m.oppSeen) || !m.oppSeen.length || pairKey(m.oppColors || []) !== ok) return;
    const p = prof[m.oppArch] || (prof[m.oppArch] = { n: 0, c: {} });
    p.n++; m.oppSeen.forEach(id => p.c[id] = (p.c[id] || 0) + 1);
  });
  return prof;
}
function detectArch(ok, seen){
  if (!ok || !seen || !seen.length) return null;
  const scored = Object.entries(archProfiles(ok)).map(([name, p]) => {
    let score = 0, shared = 0;
    seen.forEach(id => { const f = (p.c[id] || 0) / p.n; if (f > 0){ shared++; score += f; } });
    return { name, score, shared };
  }).filter(x => x.shared > 0).sort((a, b) => b.score - a.score);
  const [a, b] = scored;
  if (!a || a.shared < 2) return null;
  return { ...a, sure: a.shared >= 3 && (!b || a.score >= b.score * 1.5) };
}

function listSim(a, b){
  if (!a || !b) return 0;
  let same = 0, ta = 0, tb = 0;
  for (const k in a){ ta += a[k]; if (b[k]) same += Math.min(a[k], b[k]); }
  for (const k in b) tb += b[k];
  return Math.max(ta, tb) ? same / Math.max(ta, tb) : 0;
}
/* Passendes eigenes Deck zu einer Replay-Liste finden */
function matchDeck(colors, list){
  const key = pairKey(colors);
  const cands = allMyDecks().filter(([k, d]) => pairKey(d.colors) === key);
  let best = null;
  cands.forEach(([k, d]) => { const sim = listSim(list, deckLists[k]); if (!best || sim > best.sim) best = { k, d, sim }; });
  if (best && best.sim >= 0.75) return best;
  const named = cands.filter(([k, d]) => d.name && !deckLists[k]);
  if (named.length === 1 && cands.filter(([k]) => deckLists[k]).length === 0) return { k: named[0][0], d: named[0][1], sim: null };
  return null;
}

/* Eröffnungssuche: Begriffe wie "2P Mickey", "C Elsa", "Mickey". Per Komma getrennte Begriffe müssen alle vorkommen. */
function openingLines(m){
  const out = [];
  const add = turns => (turns || []).forEach(t => t.lines.forEach(l => out.push(("t" + t.t + " " + l).toLowerCase())));
  if (Array.isArray(m.gameList)) m.gameList.forEach(g => { add(g.openMe); add(g.openOpp); });
  add(m.openMe); add(m.openOpp);
  return out;
}
function openingText(m){ return openingLines(m).join(" "); }
function matchesOpening(m, query){
  const lines = openingLines(m);
  if (!lines.length) return false;
  return query.toLowerCase().split(",").map(x => x.trim()).filter(Boolean).every(term => {
    const mt = term.match(/^t?(\d)\s*([pics])?\s*(.*)$/i);
    if (mt && mt[1]){
      const turn = "t" + mt[1], kind = (mt[2] || "").toLowerCase(), rest = (mt[3] || "").trim();
      return lines.some(line => line.startsWith(turn + " ") && (!kind || line.includes(turn + " " + kind + " ") || line.includes(" " + kind + " ")) && (!rest || line.includes(rest)));
    }
    return lines.some(line => line.includes(term));
  });
}

function filtered(){
  const now = Date.now();
  return matches.filter(m => {
    if (filt.period && periodOf(m.ts) !== filt.period) return false;
    if (filt.range === "today"){ const d = new Date(); d.setHours(0,0,0,0); if (m.ts < d.getTime()) return false; }
    else if (filt.range !== "all" && m.ts < now - Number(filt.range) * 864e5) return false;
    if (filt.player && m.player !== filt.player) return false;
    if (filt.deck && deckKeyOf({ name: m.deckName, colors: m.deckColors || [] }) !== filt.deck) return false;
    if (deckOff.size && deckOff.has(deckKeyOf({ name: m.deckName, colors: m.deckColors || [] }))) return false;
    if (filt.opp && pairKey(m.oppColors || []) !== filt.opp) return false;
    if (filt.event && m.event !== filt.event) return false;
    if (filt.format && m.format !== filt.format) return false;
    if (filt.start && m.start !== filt.start) return false;
    if (filt.meta && m.meta !== filt.meta) return false;
    if (filt.tag && !tagsOf(m).includes(filt.tag)) return false;
    if (filt.tourney && m.tourney !== filt.tourney) return false;
    if (filt.opening && !matchesOpening(m, filt.opening)) return false;
    return true;
  });
}

function group(list, keyFn){

  return [...g.entries()].sort((a, b) => b[1].n - a[1].n);
}
const MIN_N = 5;
function wrRow(label, x, total, extra = ""){

}
function cellColor(wr){
  // 50 % neutral, darüber grün, darunter rot – über color-mix, damit hell/dunkel passt
  const d = Math.min(1, Math.abs(wr - 50) / 35);
  const col = wr >= 50 ? "var(--win)" : "var(--loss)";
  return `background:color-mix(in srgb, ${col} ${Math.round(12 + d * 60)}%, var(--surface));${d > .55 ? "color:#fff" : ""}`;
}
/* Zähleinheiten: je nach Zählweise ein Bo3 als Match oder als Einzelspiele */
function units(m, mode){

function statDecks(){
  const base = matches.filter(m => {
    if (filt.period && periodOf(m.ts) !== filt.period) return false;
    if (filt.range === "today"){ const d = new Date(); d.setHours(0,0,0,0); if (m.ts < d.getTime()) return false; }
    else if (filt.range !== "all" && m.ts < Date.now() - Number(filt.range) * 864e5) return false;
    if (filt.player && m.player !== filt.player) return false;
    if (filt.event && m.event !== filt.event) return false;
    if (filt.format && m.format !== filt.format) return false;
    if (filt.start && m.start !== filt.start) return false;
    if (filt.meta && m.meta !== filt.meta) return false;
    if (filt.tag && !tagsOf(m).includes(filt.tag)) return false;
    if (filt.tourney && m.tourney !== filt.tourney) return false;
    return true;
  });
  const g = new Map();
  base.forEach(m => {
    const k = deckKeyOf({ name: m.deckName, colors: m.deckColors || [] });
    if (!g.has(k)) g.set(k, { k, name: m.deckName || "", colors: m.deckColors || [], n: 0, w: 0 });
    const x = g.get(k); x.n++; if (m.result === "W") x.w++;

  return [...g.values()].sort((a, b) => b.n - a.n);
}

function makeStatCard(){
  const list = filtered();
  if (!list.length){ toast("Keine Matches für diese Filter."); return; }
  const mode = prefs.weight;
  const hasBo3 = list.some(m => m.format === "bo3");
  const unitWord = hasBo3 && mode !== "match" ? "Spiele" : "Matches";
  const w = list.filter(m => m.result === "W").length;
  const U = list.flatMap(m => units(m, mode));
  const pl = aggU(U.filter(u => u.start === "play")), dr = aggU(U.filter(u => u.start === "draw"));
  const per = METAS.find(x => x.id === filt.period);

  const byOpp = group(list, m => pairKey(m.oppColors || []))
    .map(([k, x]) => ({ k, n: x.n, w: x.w, q: x.n ? x.w / x.n : 0 }))
    .filter(o => o.n >= MIN_N);
  const best = byOpp.slice().sort((a, b) => b.q - a.q || b.n - a.n).slice(0, 3);
  const worst = byOpp.slice().sort((a, b) => a.q - b.q || b.n - a.n).slice(0, 3);

  const DPR = 2, W = 540, pad = 28;
  let rows = 3 + (best.length ? 1 + best.length : 0) + (worst.length ? 1 + worst.length : 0);
  const H = 150 + 150 + rows * 30 + 60;
  const cv = document.createElement("canvas");
  cv.width = W * DPR; cv.height = H * DPR;
  const g = cv.getContext("2d"); g.scale(DPR, DPR);
  const FN = "-apple-system, Segoe UI, Roboto, sans-serif";

  g.fillStyle = "#10152A"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#1A2140"; g.fillRect(0, 0, W, 92);
  g.fillStyle = "#E6E9F4"; g.font = "700 26px " + FN; g.textBaseline = "alphabetic";
  g.fillText("Match-Log", pad, 42);
  g.fillStyle = "#98A0BE"; g.font = "15px " + FN;
  g.fillText((per ? per.name : "Alle Zeiträume") + "  ·  " + list.length + " Matches", pad, 70);

  // große Quote
  let y = 150;

const fmtDate = ts => new Date(ts).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
/* Bo3-Einträge, denen Folgespiele als eigene Bo1-Einträge fehlen */
function bo3Repairs(){
  const all = [...matches].sort((a, b) => a.ts - b.ts), used = new Set(), out = [];
  all.forEach(m => {
    if (used.has(m.id) || m.seriesId || m.format !== "bo3" || !Array.isArray(m.gameList) || !m.gameList.length || !m.oppName) return;
    if (m.by && myId && m.by !== myId) return;
    let gl = m.gameList.slice(), last = m.ts; const take = [];
    if (seriesOf(gl).done) return;
    for (const x of all){
      if (x.ts <= m.ts || used.has(x.id) || x.id === m.id) continue;
      if (x.ts - last > 3600e3) break;
      if (x.seriesId || x.format === "bo3" || x.player !== m.player || x.oppName !== m.oppName) continue;
      take.push(x); gl.push({ r: x.result }); last = x.ts;
      if (seriesOf(gl).done) break;
    }
    if (take.length){ used.add(m.id); take.forEach(x => used.add(x.id)); out.push({ m, take }); }
  });
  return out;
}
async function applyBo3Repairs(){
  const todo = bo3Repairs(); let n = 0;
  for (const { m, take } of todo){
    const gameList = [...m.gameList, ...take.map(x => ({ r: x.result, s: x.start || null, mull: x.mull ?? null, tags: [...(x.tags || [])], turns: x.turns ?? null, openMe: x.openMe || null, openOpp: x.openOpp || null }))];
    const ser = seriesOf(gameList);
    const result = ser.result || (ser.w > ser.l ? "W" : ser.l > ser.w ? "L" : gameList[gameList.length - 1].r);
    const seenN = take.reduce((o, x) => mergeSeen(o, x.oppSeenN || {}), { ...(m.oppSeenN || {}) });
    const ok = await store.update(m.id, {
      gameList, result, games: ser.score,
      replays: [...(m.replays || []), ...take.flatMap(x => x.replays || [])],
      oppSeenN: Object.keys(seenN).length ? seenN : null,
      oppSeen: Object.keys(seenN).length ? Object.keys(seenN) : (m.oppSeen || null),
      notes: [m.notes, ...take.map(x => x.notes)].filter(Boolean).join(" · ").slice(0, 500)
    });
    if (!ok) continue;
    for (const x of take) await store.remove(x.id);
    n++;
  }
  return n;
}

async function downloadFile(filename, data, mime){
  if (dlCap) {
    try { await dlCap.save({ filename, data }); return true; }
    catch (e) { if (e && (e.code === "declined" || e.code === "rate_limited")) return false; }
  }
  return blobDownload(filename, data, mime);
}
function blobDownload(filename, data, mime){
  const blob = new Blob([data], { type: mime || "application/octet-stream" });

  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
  return true;
}

function takeCounter(res){
  const turns = ctr.turn, start = ctr.start;

  if (prefs.format === "bo3"){
    form.perGame = true;
    let i = visibleGames().findIndex(g => !g.r);

    const ser = seriesOf(visibleGames().filter(g => g.r));

  if (toEntry){ switchTab("entry"); toast("Vom Zähler übernommen. Deck und Gegner prüfen, dann speichern."); }

}

/* ============================================================
   Replay einlesen (rein lokal) — portiert aus dem getesteten Parser
   ============================================================ */
async function gunzip(buf){
  if (typeof DecompressionStream === "undefined") throw new Error("Dieser Browser kann .gz nicht entpacken. Bitte die entpackte .replay-Datei nutzen.");
  const ds = new DecompressionStream("gzip");
  const stream = new Response(buf).body.pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function inflateRaw(buf){
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Response(buf).body.pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
/* Minimaler ZIP-Leser: liest lokale Dateikoepfe, Methode 0 (stored) und 8 (deflate) */
async function readZip(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const out = [];
  let i = 0;
  while (i + 4 <= bytes.length && dv.getUint32(i, true) === 0x04034b50){
    const method = dv.getUint16(i+8, true);
    let compSize = dv.getUint32(i+18, true);
    const nameLen = dv.getUint16(i+26, true);
    const extraLen = dv.getUint16(i+28, true);
    const flags = dv.getUint16(i+6, true);
    const nameStart = i+30;
    const name = new TextDecoder().decode(bytes.subarray(nameStart, nameStart+nameLen));
    let dataStart = nameStart + nameLen + extraLen;
    if (flags & 0x08){ // Größe steht erst im Data-Descriptor: bis zur nächsten Signatur suchen
      let j = dataStart;
      while (j+4 <= bytes.length){
        const sig = dv.getUint32(j, true);
        if (sig === 0x08074b50 || sig === 0x04034b50 || sig === 0x02014b50) break;
        j++;
      }
      compSize = j - dataStart;
    }
    const comp = bytes.subarray(dataStart, dataStart+compSize);
    let data;
    try { data = method === 0 ? comp : await inflateRaw(comp); }
    catch { data = null; }
    if (data && /\.(replay|json)(\.gz)?$/i.test(name)){
      out.push({ name, data: name.toLowerCase().endsWith(".gz") ? await gunzip(data) : data });
    }
    i = dataStart + compSize;
    if (flags & 0x08) i += (dv.getUint32(i, true) === 0x08074b50) ? 16 : 12;
  }
  return out;
}
async function fileToReplays(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  const n = file.name.toLowerCase();
  const isZip = buf[0]===0x50 && buf[1]===0x4b;
  const isGz  = buf[0]===0x1f && buf[1]===0x8b;
  const results = [];
  if (n.endsWith(".zip") || (isZip && !n.endsWith(".replay") && !n.endsWith(".json"))){
    for (const e of await readZip(buf)) results.push({ name: e.name, json: JSON.parse(new TextDecoder().decode(e.data)) });
  } else if (n.endsWith(".gz") || isGz){
    results.push({ name: file.name, json: JSON.parse(new TextDecoder().decode(await gunzip(buf))) });
  } else {
    results.push({ name: file.name, json: JSON.parse(new TextDecoder().decode(buf)) });
  }
  return results;
}

/* --- Kernparser: aus einem Replay-JSON die bestätigten Felder ziehen --- */
function collectCards(o, map){
  if (Array.isArray(o)){ for (const v of o) collectCards(v, map); }
  else if (o && typeof o === "object"){
    if (typeof o.id === "string" && Array.isArray(o.colors)) map[o.id] = o;
    for (const k in o) collectCards(o[k], map);
  }
}
function parseReplay(d){
  const b = d.baseSnapshot || {};
  const me = d.perspective, opp = 3 - me;
  const cards = {}; collectCards(d, cards);
  let first = b.firstPlayer;
  for (const f of (d.frames||[])) for (const p of (f.patch||[]))
    if (p.path === "/firstPlayer" && p.value) first = p.value;
  const mull = {}; const oppCards = {};
  for (const l of (d.logs||[])){
    if (l.type === "MULLIGAN")
      mull[l.player] = (l.data && l.data.mulliganCount != null) ? l.data.mulliganCount : Math.floor((l.cardRefs||[]).length/2);
    if (l.player === opp && ["CARD_PLAYED","CARD_INKED","CARD_REVEALED"].includes(l.type))
      for (const r of (l.cardRefs||[]).slice(0,1)) oppCards[r.id] = (oppCards[r.id]||0)+1;
  }
  const colorsOf = ids => { const s=new Set(); ids.forEach(i => (cards[i]?.colors||[]).forEach(c=>s.add(c))); return [...s]; };
  const rv0 = b.roomView || {};
  const deckIds = (rv0.mySetup && Array.isArray(rv0.mySetup.deckCardIds) && rv0.mySetup.deckCardIds.length) ? rv0.mySetup.deckCardIds : (d.decklist || []);
  const myList = {}; deckIds.forEach(id => myList[id] = (myList[id] || 0) + 1);
  const nameMap = {}; Object.values(cards).forEach(c => { if (c.id) nameMap[c.id] = c.fullName || c.name || c.id; });
  const myColors = colorsOf([...deckIds, ...(d.decklist || [])]);
  const oppColors = colorsOf([...Object.keys(oppCards), ...(function(){ const ids=[]; const w=o=>{ if(Array.isArray(o)) o.forEach(w); else if(o&&typeof o==="object"){ if(typeof o.id==="string"&&o.instanceId!=null) ids.push(o.id); for(const k in o) w(o[k]); } }; w(b.opponent); for (const f of (d.frames||[])) for (const p of (f.patch||[])) if (/^\/opponent\//.test(p.path||"")) w(p.value); return ids; })()]);
  const rv = b.roomView || {};
  let start = d.createdAt;
  for (const f of (d.frames||[])) for (const p of (f.patch||[])) if (p.path === "/gameStartedAt") start = p.value;
  const names = d.playerNames || {};
  /* Exemplare: jede Karte hat in den Spielständen eine eigene instanceId */
  const inst = {};
  const walkInst = o => {
    if (Array.isArray(o)) o.forEach(walkInst);
    else if (o && typeof o === "object"){
      if (typeof o.id === "string" && o.instanceId != null) (inst[o.id] = inst[o.id] || new Set()).add(o.instanceId);
      for (const k in o) walkInst(o[k]);
    }
  };
  walkInst(b.opponent);
  for (const f of (d.frames||[])) for (const p of (f.patch||[])) if (/^\/opponent\//.test(p.path || "")) walkInst(p.value);
  const oppSeenN = {};
  new Set([...Object.keys(oppCards), ...Object.keys(inst)]).forEach(id => oppSeenN[id] = Math.max(1, inst[id] ? inst[id].size : 0));
  const oppCardList = Object.keys(oppCards).map(id => ({ id, name: cards[id]?.name || id, n: oppCards[id] }));

  /* ---- Eröffnung: erste 5 Züge je Seite, Aktionen P/I/C/A/S ---- */
  const shortName = nm => String(nm || "").split(" - ")[0];
  function buildOpening(side){
    const perTurn = {};
    const push = (t, kind, text) => { (perTurn[t] = perTurn[t] || { P:[], I:[], S:[], A:[], C:[] })[kind].push(text); };
    for (const l of (d.logs||[])){
      if (l.player !== side) continue;
      const t = l.turnNumber; if (!t) continue;
      const refs = l.cardRefs || [];
      const nm = (l.data && l.data.cardName) || (refs[0] && refs[0].name) || "";
      if (l.type === "CARD_PLAYED"){
        if (l.data && l.data.isSung){ push(t, "S", shortName(nm) + (refs[1] ? " \u2192 " + shortName(refs[1].name) : "")); }
        else push(t, "P", shortName(nm)); // Shift-Grundkarte (refs[1]) ist kein Ziel
      }
      else if (l.type === "CARD_INKED") push(t, "I", shortName(nm));
      else if (l.type === "ABILITY_ACTIVATED") push(t, "A", shortName(nm) + (refs[1] ? " \u2192 " + shortName(refs[1].name) : ""));
      else if (l.type === "CARD_ATTACK"){ if (!(l.data && l.data.rawDamageToDefender != null)) continue; push(t, "C", shortName((refs[0] && refs[0].name) || nm) + (refs[1] ? " \u2192 " + shortName(refs[1].name) : "")); }
    }
    // globale Zugnummern dieser Seite auf 1..5 umnummerieren
    const turns = Object.keys(perTurn).map(Number).sort((a,b)=>a-b).slice(0,5);
    return turns.map((t, i) => {
      const p = perTurn[t];
      const lines = [];
      ["P","I","C","A","S"].forEach(k => { if (p[k].length){ const seen = new Set(), uniq = p[k].filter(x => (seen.has(x) ? false : seen.add(x))); lines.push(k + " " + uniq.join(", ")); } });
      return { t: i + 1, lines };
    }).filter(x => x.lines.length);
  }
  const openMe = buildOpening(me), openOpp = buildOpening(opp);

  /* Bo3-Serie: matchView trägt Serien-ID, Spielnummer und Siege VOR diesem Spiel */
  const mv0 = b.matchView || null; let nextGame = null;
  for (const f of (d.frames||[])) for (const p of (f.patch||[])) if (p.path === "/matchView/nextGameId" && p.value) nextGame = p.value;
  const series = mv0 && mv0.id ? {
    id: mv0.id, no: Number(mv0.currentGameNumber) || 1, fmt: mv0.format || null,
    before: [Number(mv0["player" + me + "Wins"]) || 0, Number(mv0["player" + opp + "Wins"]) || 0],
    next: nextGame
  } : null;
  const tsNum = new Date(start).getTime();
  return {
    series,
    ts: Number.isFinite(tsNum) && tsNum > 0 ? tsNum : Date.now(),
    myList, cardNames: nameMap, oppSeen: Object.keys(oppSeenN), oppSeenN,
    me: names[String(me)] || "", opp: names[String(opp)] || "",
    win: d.winner === me, reason: d.victoryReason, turns: d.turnCount,
    start: first === me ? "play" : (first === opp ? "draw" : null),
    mullMe: mull[me] ?? null, mullOpp: mull[opp] ?? null,
    myColors, oppColors,
    format: (series && series.fmt) || rv.matchFormat || "bo1", set: rv.gameFormat || "",
    replayId: b.replayId || d.gameId, gameId: d.gameId,
    openMe, openOpp,
    oppCards: oppCardList
  };
}

/* --- Ein geparstes Replay ins Eingabeformular übernehmen. Gibt bei Bo3 die Spielnummer (0-basiert) zurück. --- */
function prefillFromReplay(r){
  rememberNames(r.cardNames);
  const hit = matchDeck(r.myColors.slice(0, 2), r.myList);
  if (hit){
    prefs.deckKey = hit.k; LS.set("deckKey", prefs.deckKey); form.deckPending = null;
    form.deckHint = `Deck erkannt: ${hit.d.name || pairName(pairKey(hit.d.colors))}` + (hit.sim != null ? ` (${Math.round(hit.sim * 60)} von 60 Karten gleich)` : "") + ". Falsch? Einfach anderes Deck antippen.";
  } else {
    prefs.deckKey = ""; form.deckHint = null;
    form.deckPending = { colors: r.myColors.slice(0, 2), list: r.myList };
    form.newDeckColors = r.myColors.slice(0, 2);
    $("#newDeck").hidden = false;
  }
  const openSeries = (r.series && form.seriesId === r.series.id) || form.perGame && prefs.format === "bo3" && form.gl.some(g => g.r)
    && !seriesOf(visibleGames().filter(g => g.r)).done
    && !!r.opp && $("#oppName").value.trim() === r.opp;
  const bo3 = r.format === "bo3" || openSeries;
  const newOpp = pairKey(r.oppColors.slice(0, 2));
  const curName = $("#oppName").value.trim();
  const same = bo3 && form.perGame && prefs.format === "bo3" && form.gl.some(g => g.r)
    && (curName && r.opp ? curName === r.opp : pairKey(form.opp) === newOpp)
    && !seriesOf(visibleGames().filter(g => g.r)).done;
  if (!same){
    form.gl = [blankGame(), blankGame(), blankGame()]; form.oppSeen = []; form.oppSeenN = {}; form.arch = null; form.archSuggest = null; form.openMe = null; form.openOpp = null; form.seriesId = null;
    $("#notes").value = "";
    document.querySelectorAll("#replayInputs input").forEach(i => i.value = "");
  }
  if (!same || r.oppColors.length >= form.opp.length) form.opp = r.oppColors.slice(0, 2);
  prefs.format = bo3 ? "bo3" : "bo1"; LS.set("format", prefs.format);
  form.myList = r.myList;
  form.oppSeen = [...new Set([...form.oppSeen, ...r.oppSeen])];
  form.oppSeenN = mergeSeen(form.oppSeenN, r.oppSeenN);
  let slot = 0;
  if (bo3){
    form.perGame = true;
    slot = visibleGames().findIndex(g => !g.r); if (slot < 0) slot = 0;
    if (r.series){
      form.seriesId = r.series.id;
      slot = Math.min(2, Math.max(0, r.series.no - 1));
      let dw = r.series.before[0] - form.gl.slice(0, slot).filter(g => g.r === "W").length;
      let dl = r.series.before[1] - form.gl.slice(0, slot).filter(g => g.r === "L").length;
      for (let i = 0; i < slot; i++) if (!form.gl[i].r){
        const rr = dw > 0 ? (dw--, "W") : dl > 0 ? (dl--, "L") : null;
        if (rr) Object.assign(form.gl[i], { r: rr, missing: true });
      }
    }
    Object.assign(form.gl[slot], { r: r.win ? "W" : "L", s: r.start, mull: r.mullMe, turns: r.turns || null, openMe: r.openMe || null, openOpp: r.openOpp || null, missing: false, no: r.series ? r.series.no : null, wb: r.series ? r.series.before : null, rep: String(r.replayId) });
    const nx = form.gl[slot + 1]; if (nx && !nx.s) nx.s = r.win ? "draw" : "play";
  } else {
    form.result = r.win ? "W" : "L"; form.games = null; form.start = r.start;
    form.mull = r.mullMe != null ? String(r.mullMe) : null;
    form.openMe = r.openMe || null; form.openOpp = r.openOpp || null;
  }
  const sug = detectArch(pairKey(form.opp), form.oppSeen);
  form.archSuggest = sug;
  if (sug && !form.arch) form.arch = sug.name;
  renderEntry();
  $("#oppName").value = r.opp || curName;
  $("#turns").value = bo3 ? "" : (r.turns || "");
  const inp = document.querySelectorAll("#replayInputs input")[slot]; if (inp) inp.value = "https://duels.ink/replay/" + r.replayId;
  return slot;
}

/* --- Mehrere Replays: Bo3-Spiele desselben Gegners zu einem Match bündeln --- */
function groupReplays(parsed){
  const groups = [], bySeries = new Map();
  /* duels.ink markiert oft nur Spiel 1 als Bo3, die Folgespiele als Bo1.
     Darum: Folgespiel gegen denselben Gegner innerhalb einer Stunde gehört zum offenen Bo3. */
  [...parsed].sort((a, b) => a.ts - b.ts).forEach(r => {
    if (r.series){
      let S = bySeries.get(r.series.id);
      if (!S){ S = { bo3: r.format === "bo3", seriesId: r.series.id, list: [] }; bySeries.set(r.series.id, S); groups.push(S); }
      if (!S.list.some(x => x.series.no === r.series.no)) S.list.push(r);
      if (r.format === "bo3") S.bo3 = true;
      return;
    }
    const g = groups.find(G => !G.seriesId && (G.bo3 || r.format === "bo3")
      && !seriesOf(G.list.map(x => ({ r: x.win ? "W" : "L" }))).done
      && (G.list[0].opp && r.opp ? G.list[0].opp === r.opp : pairKey(G.list[0].oppColors) === pairKey(r.oppColors))
      && r.ts - G.list[G.list.length - 1].ts < 3600e3);
    if (g){ g.list.push(r); g.bo3 = true; return; }
    groups.push({ bo3: r.format === "bo3", list: [r] });
  });
  groups.forEach(G => { if (G.seriesId) G.list.sort((a, b) => a.series.no - b.series.no); });
  return groups;
}

/* --- Import-Ablauf: eine oder mehrere Dateien --- */
function gameOfReplay(x){
  return { no: x.series ? x.series.no : null, r: x.win ? "W" : "L", s: x.start, mull: x.mullMe, tags: [], turns: x.turns || null,
    openMe: x.openMe || null, openOpp: x.openOpp || null, wb: x.series ? x.series.before : null, rep: String(x.replayId), next: x.series ? x.series.next : null };
}
/* Bekannte Spiele nach Nummer ordnen; Lücken (vom Export verschluckt) aus dem Spielstand der Folgespiele erschließen */
function buildSeriesGames(known){
  const ks = [...known].sort((a, b) => a.no - b.no), out = [];
  let w = 0, l = 0;
  for (const g of ks){
    let dw = 0, dl = 0;
    if (g.wb){ dw = Math.max(0, g.wb[0] - w); dl = Math.max(0, g.wb[1] - l); }
    while (out.length < g.no - 1){
      const r = dw > 0 ? (dw--, "W") : dl > 0 ? (dl--, "L") : null;
      out.push({ no: out.length + 1, r, s: null, mull: null, tags: [], turns: null, missing: true });
    }
    if (g.wb){ w = g.wb[0]; l = g.wb[1]; }
    out.push({ ...g, missing: false });
    if (g.r === "W") w++; else if (g.r === "L") l++;
  }
  const ser = seriesOf(out);
  if (!ser.done && out.length < 3) out.push({ no: out.length + 1, r: null, s: null, mull: null, tags: [], turns: null, missing: true });
  return out;
}
function knownReplayIds(){
  const set = new Set();
  matches.forEach(m => (m.replays || []).forEach(u => replayIdsFrom(u).forEach(id => set.add(id))));
  return set;
}
async function handleReplayFiles(fileList){
  const box = $("#importStatus"); box.hidden = false; box.className = "import-status";
  box.textContent = "Lese ein …";
  const parsed = [];
  const errors = [];
  for (const file of fileList){
    try {
      for (const { json } of await fileToReplays(file)){
        if (json && json.format && String(json.format).startsWith("duels-replay")) parsed.push(parseReplay(json));
        else errors.push(file.name + ": kein duels-Replay");
      }
    } catch(e){ errors.push(file.name + ": " + e.message); }
  }
  const known = knownReplayIds(), single = parsed.length === 1; let skipped = 0;
  const knownSer = new Set(matches.filter(m => m.seriesId).flatMap(m => (m.replays || []).flatMap(u => replayIdsFrom(u))));
  for (let i = parsed.length - 1; i >= 0; i--){
    const id = String(parsed[i].replayId);
    if (known.has(id) && (single || !parsed[i].series || knownSer.has(id))) { parsed.splice(i, 1); skipped++; }
  }
  if (!parsed.length && skipped){
    box.className = "import-status ok";
    box.textContent = skipped === 1 ? "Dieses Replay ist schon eingetragen." : `Alle ${skipped} Replays sind schon eingetragen, nichts Neues dabei.`;
    return;

    return;

    for (const G of groupReplays(parsed)){

      /* frühere Einträge derselben Serie oder mit denselben Replays (z. B. falsch zerlegte Bo3) */
      const gIds = L.map(x => String(x.replayId));
      const old = matches.filter(m => (G.seriesId && m.seriesId === G.seriesId) || (m.replays || []).some(u => replayIdsFrom(u).some(id => gIds.includes(id))))
        .filter(m => !(m.by && myId && m.by !== myId)).sort((a, b) => a.ts - b.ts);
      const base = old[0] || null;
      const tagsByRep = {};
      old.forEach(m => {
        if (Array.isArray(m.gameList)) m.gameList.forEach((g, i) => { const id = g.rep || replayIdsFrom((m.replays || [])[i] || "")[0]; if (id && (g.tags || []).length) tagsByRep[id] = g.tags; });
        else if ((m.tags || []).length) (m.replays || []).forEach(u => replayIdsFrom(u).forEach(id => tagsByRep[id] = m.tags));

      const seen = [...new Set(L.flatMap(x => x.oppSeen))];
      const seenN = L.reduce((o, x) => mergeSeen(o, x.oppSeenN), {});
      const sug = detectArch(pairKey(oppColors), seen);

      if (G.bo3){

          fresh.forEach(g => { if (!byNo.has(g.no)) byNo.set(g.no, g); });

      const firstKnown = gameList ? gameList.find(g => !g.missing) : null;

        ...old.flatMap(m => m.replays || [])

      const seenAll = old.reduce((o, x) => mergeSeen(o, x.oppSeenN || {}), seenN);
      const m = {

        deckName: base && base.deckName ? base.deckName : (hit ? hit.d.name || "" : ""),
        deckColors: base && base.deckColors && base.deckColors.length ? base.deckColors : r.myColors.slice(0, 2), oppColors,
        oppArch: base && base.oppArch ? base.oppArch : (sug && sug.sure ? sug.name : ""), oppName: r.opp || (base ? base.oppName : ""),
        format: G.bo3 ? "bo3" : "bo1", seriesId: G.seriesId || null, incomplete,
        result, games: ser ? ser.score : null, start: firstKnown ? firstKnown.s : r.start,
        gameList, turns: G.bo3 ? null : (r.turns || null),
        myList: r.myList, oppSeen: Object.keys(seenAll), oppSeenN: seenAll,
        openMe: G.bo3 ? null : (r.openMe || null), openOpp: G.bo3 ? null : (r.openOpp || null),
        event: base ? base.event : prefs.event, meta: base ? base.meta : prefs.meta, tags: G.bo3 ? [] : (tagsByRep[String(r.replayId)] || []),
        notes: [...new Set(old.map(x => x.notes).filter(Boolean))].join(" · ").slice(0, 500), keyCards: base ? base.keyCards || "" : "",
        mull: firstKnown ? firstKnown.mull : r.mullMe, perf: base ? base.perf ?? null : null, tourney: base ? base.tourney || "" : "", round: base ? base.round ?? null : null,
        replays: repLinks, by: base ? base.by || null : null

      let id = null;
      if (base){
        if (await store.update(base.id, m)){ id = base.id; for (const x of old.slice(1)) await store.remove(x.id); fixed++; }
      } else id = await store.add(m);
      if (id){
        if (!base) ok++;
        savedIds.push(id);
        if (m.deckName) { if (hit) rememberDeckList(hit.k, r.myList); }
        else if (hit) rememberDeckList(hit.k, r.myList);
        else {

          if (!u){ u = { ck, colors: m.deckColors, list: r.myList, ids: [] }; unknown.push(u); }

/* Hilfe zum Zuordnen einer unbekannten eigenen Liste: Unterschiede zur ähnlichsten eigenen Liste und betroffene Matches */
function unknownDetails(u, all){
  const list = u.list || {};
  const refs = [
    ...allMyDecks().filter(([k, d]) => pairKey(d.colors) === u.ck && deckLists[k]).map(([k, d]) => ({ name: d.name ? `„${d.name}“` : "deiner gespeicherten Liste", list: deckLists[k] })),
    ...(all || []).filter(x => x !== u && x.ck === u.ck).map(x => ({ name: `der anderen ${pairName(u.ck)}-Liste oben`, list: x.list }))
  ].map(r => ({ ...r, sim: listSim(list, r.list) })).sort((a, b) => b.sim - a.sim);
  const byName = (a, b) => cardName(a[0]).localeCompare(cardName(b[0]));
  let cards = "";
  if (refs.length){
    const ref = refs[0], ids = new Set([...Object.keys(list), ...Object.keys(ref.list)]);
    const diff = [...ids].map(id => [id, (list[id] || 0) - (ref.list[id] || 0)]).filter(([, d]) => d);
    const more = diff.filter(([, d]) => d > 0).sort((a, b) => b[1] - a[1] || byName(a, b)).slice(0, 8);
    const less = diff.filter(([, d]) => d < 0).sort((a, b) => a[1] - b[1] || byName(a, b)).slice(0, 8);
    const fmt = ([id, d]) => `${d > 0 ? "+" : "−"}${Math.abs(d)} ${esc(cardName(id))}`;
    cards = `<div class="note" style="flex-basis:100%">Am ähnlichsten zu ${esc(ref.name)} (${pct(ref.sim * 100, 100)} % gleich).`
      + (more.length ? `<br>Zusätzlich drin: ${more.map(fmt).join(", ")}` : "")
      + (less.length ? `<br>Weniger oder nicht drin: ${less.map(fmt).join(", ")}` : "")
      + (!more.length && !less.length ? " Gleiche Karten." : "") + `</div>`;
  } else {
    const top = Object.entries(list).sort((a, b) => b[1] - a[1] || byName(a, b)).slice(0, 8);
    if (top.length) cards = `<div class="note" style="flex-basis:100%">Karten (Auszug): ${top.map(([id, n]) => `${n}× ${esc(cardName(id))}`).join(", ")}</div>`;
  }
  const rows = u.ids.map(id => matches.find(m => m.id === id)).filter(Boolean).sort((a, b) => a.ts - b.ts).map(m =>
    `<li>${esc(fmtDate(m.ts))} · ${m.result === "W" ? "Sieg" : "Niederlage"}${m.games ? " " + esc(m.games) : ""} gegen ${mini(pairKey(m.oppColors || []))} ${esc(pairName(pairKey(m.oppColors || [])))}${m.oppArch ? " (" + esc(m.oppArch) + ")" : ""}${m.oppName ? " · " + esc(m.oppName) : ""}</li>`).join("");
  return cards + (rows ? `<details class="seen" style="flex-basis:100%"><summary>Welche Matches?</summary><ul class="seenlist" style="columns:1">${rows}</ul></details>` : "");
}

/* --- Replay per Link --- */
function replayIdsFrom(text){
  const ids = [];
  for (const raw of String(text).split(/\s+/)){
    if (!raw) continue;
    let u; try { u = new URL(raw.trim()); } catch { continue; }
    if (!/(^|\.)duels\.ink$/i.test(u.hostname)) continue;
    const m = u.pathname.match(/\/(?:r|replay|replays)\/([A-Za-z0-9_-]+)/);
    if (m) ids.push(m[1]);
  }
  return [...new Set(ids)];
}
async function fetchReplay(id){
  const urls = ["https://duels.ink/r/" + id, "https://duels.ink/replay/" + id];
  let lastErr = "";
  for (const url of urls){
    try {
      const res = await fetch(url, { headers: { Accept: "application/json, application/octet-stream" } });
      if (!res.ok){ lastErr = "Antwort " + res.status; continue; }
      const buf = new Uint8Array(await res.arrayBuffer());
      const isGz = buf[0] === 0x1f && buf[1] === 0x8b;
      const first = String.fromCharCode(buf[0] || 0);
      if (!isGz && first !== "{" && first !== "P"){ lastErr = "Die Seite liefert die Ansicht, nicht die Replay-Datei"; continue; }
      return new File([buf], id + (isGz ? ".replay.gz" : first === "P" ? ".zip" : ".replay"));
    } catch (e) {
      lastErr = "blocked";
    }
  }
  throw new Error(lastErr);
}
async function handleReplayLinks(){
  const inp = $("#replayLink"), box = $("#importStatus");
  const ids = replayIdsFrom(inp.value);
  box.hidden = false;
  if (!ids.length){
    box.className = "import-status err";
    box.textContent = "Das ist kein Replay-Link von duels.ink. Er sieht etwa so aus: https://duels.ink/replay/abc123";
    return;
  }
  box.className = "import-status"; box.textContent = ids.length > 1 ? `Lade ${ids.length} Replays …` : "Lade Replay …";
  const files = [], failed = [];
  let blocked = false;
  for (const id of ids){
    try { files.push(await fetchReplay(id)); }
    catch (e) { failed.push(id); if (e.message === "blocked") blocked = true; }
  }
  if (files.length) {
    await handleReplayFiles(files);
    if (!failed.length) inp.value = "";
  }
  if (failed.length){
    const links = failed.map(id => "https://duels.ink/replay/" + id);
    const why = blocked
      ? "duels.ink erlaubt dieser Seite nicht, Replays direkt abzuholen."
      : "Unter diesem Link kam keine Replay-Datei zurück.";
    const html = `<div>${files.length ? "Nicht alle Links ließen sich laden. " : ""}${why} So geht es trotzdem: Replay öffnen, dort herunterladen und die Datei oben bei „Replay-Datei einlesen“ auswählen.</div>`
      + `<div class="acts">${links.map((l, i) => `<button class="chip" type="button" data-openrep="${esc(l)}">${links.length > 1 ? "Replay " + (i + 1) + " öffnen" : "Replay öffnen"}</button>`).join("")}</div>`;
    if (files.length){ box.insertAdjacentHTML("beforeend", "<div style='margin-top:8px;color:var(--ink)'>" + html + "</div>"); }
    else { box.className = "import-status err"; box.innerHTML = html; }
  }
}

    let ok = false;
    try { await navigator.clipboard.writeText(data); ok = true; } catch {}
    if (!ok) { try { ta.focus(); ta.select(); ok = document.execCommand("copy"); } catch {} }
    tHint.textContent = ok
      ? `Kopiert (${matches.length} Matches). Jetzt die neue App öffnen, im Verlauf auf „Text einfügen“ tippen und einfügen.`
      : `Kopieren ging nicht automatisch: Text im Feld lange antippen, „Alles auswählen“ und „Kopieren“. Dann in der neuen App im Verlauf auf „Text einfügen“ tippen.`;
    if (ok) { LS.set("lastBackup", { ts: Date.now(), count: matches.length }); renderBackupNag(); }
  };
  $("#pasteJson").onclick = () => {
    tb.hidden = false; tGo.hidden = false; ta.readOnly = false; ta.value = "";
    tHint.textContent = "Kopierten Sicherungs-Text hier einfügen (Feld lange antippen, „Einfügen“) und dann „Importieren“ tippen.";
    ta.focus();
  };
  tGo.onclick = () => { if (importBackupText(ta.value)) { ta.value = ""; tb.hidden = true; } };
  $("#textBackupClose").onclick = () => { tb.hidden = true; ta.value = ""; };
  $("#impJsonFile").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    importBackupText(await f.text());
    e.target.value = "";
  };
  function importBackupText(text){
    try {
      const obj = JSON.parse(String(text).trim());
      const incoming = Array.isArray(obj) ? obj : obj.matches;
      if (!Array.isArray(incoming)) throw new Error("keine Matches gefunden");
      const me = prefs.player.trim();
      const own = !obj.prefs || !obj.prefs.player || !me || String(obj.prefs.player).trim() === me;
      const idx = new Map(matches.map((m, i) => [m.id, i]));
      let added = 0, updated = 0;
      for (const m of incoming){
        if (m.id && idx.has(m.id)){
          const cur = matches[idx.get(m.id)];
          if (cur.player !== me && JSON.stringify(cur) !== JSON.stringify(m)){ matches[idx.get(m.id)] = { ...m }; updated++; }
          continue;
        }
        matches.push({ ...m, id: m.id || ("l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)) }); added++;
      }
      LS.set("matches", matches);
      const who = [...new Set(incoming.map(m => m.player).filter(Boolean))];
      if (own && obj.prefs && obj.prefs.decks){ const dm=new Map(); [...prefs.decks, ...obj.prefs.decks].forEach(d=>dm.set(deckKeyOf(d),d)); prefs.decks=[...dm.values()]; }
      if (obj.prefs && obj.prefs.archetypes) for (const [k, v] of Object.entries(obj.prefs.archetypes)) prefs.archetypes[k] = [...new Set([...(prefs.archetypes[k] || []), ...v])];
      if (obj.prefs && Array.isArray(obj.prefs.customTags)) prefs.customTags = [...new Set([...prefs.customTags, ...obj.prefs.customTags])];
      if (obj.cardNames) rememberNames(obj.cardNames);
      savePrefs();
      renderAll();
      $("#backupMsg").textContent = `${added} neue Matches importiert${updated ? `, ${updated} aktualisiert` : ""}${who.length ? " (" + who.join(", ") + ")" : ""}. Bereits vorhandene übersprungen.` + (own ? "" : " Im Filter „Spieler“ kannst du zwischen den Personen wechseln.");
      return true;
    } catch(err){ $("#backupMsg").textContent = "Import fehlgeschlagen: Das ist keine vollständige Match-Log-Sicherung."; return false; }
  }
})();

/* Alte Claude-Artefakt-Version: auf die feste Adresse hinweisen */
if (window.claude) {
  const b = $("#banner");
  b.innerHTML = `<b>Match-Log ist umgezogen:</b> <a href="https://salamibus.github.io/Lorcana-Tracker/" target="_blank" rel="noopener" style="color:var(--ink)">salamibus.github.io/Lorcana-Tracker</a><br>`
    + `So nimmst du deine Matches mit: hier im Verlauf ganz unten „Als Text kopieren“ tippen, die neue Adresse öffnen und dort im Verlauf „Text einfügen“.`
    + `<div class="acts" style="margin-top:8px"><button class="chip" type="button" id="moveGo">Zum Kopieren</button></div>`;
  b.hidden = false;
  $("#moveGo").onclick = () => { switchTab("log"); $("#copyJson").scrollIntoView({ block: "center" }); };
}
renderAll();
if (!storageProbe()) storageFailed();
store.init();
})();
</script>
</body>
